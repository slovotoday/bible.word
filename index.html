<title>Слово для тебе — LayerUp Studio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#fafafa;
padding:24px;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
color:#111;

cursor:pointer;
}

.card{
max-width:420px;
width:100%;
text-align:center;
}

.logo{
font-size:11px;
letter-spacing:6px;
text-transform:uppercase;
color:#b8b8b8;

margin-bottom:48px;
}

.verse{
font-size:42px;
font-weight:200;
line-height:1.18;
letter-spacing:-1px;

margin-bottom:34px;

transition:.35s;
}

.ref{
font-size:11px;
letter-spacing:2px;
text-transform:uppercase;
color:#9c9c9c;

transition:.35s;
}

/* LayerUp Studio */

.layerup{
display:inline-flex;
align-items:center;
gap:10px;

margin-top:48px;

padding:11px 18px;

border:1px solid #ececec;
border-radius:999px;

background:white;

font-size:12px;
letter-spacing:.8px;
text-decoration:none;

color:#8d8d8d;

transition:.25s;
}

.layerup:hover{
color:#111;
border-color:#d7d7d7;
background:#fff;
transform:translateY(-1px);
}

.layerup svg{
width:15px;
height:15px;
fill:currentColor;
}

.layerup .arrow{
font-size:14px;
line-height:1;
transition:.25s;
}

.layerup:hover .arrow{
transform:translate(2px,-2px);
}


/* Language selector */
.language{
position:fixed;
top:20px;
right:20px;
z-index:10;
display:flex;
align-items:center;
gap:2px;
padding:3px;
border:1px solid #e9e9e9;
border-radius:999px;
background:rgba(255,255,255,.92);
box-shadow:0 2px 12px rgba(0,0,0,.04);
}

.language button{
border:0;
background:transparent;
color:#999;
font-family:inherit;
font-size:10px;
letter-spacing:1px;
padding:6px 9px;
border-radius:999px;
cursor:pointer;
transition:.2s ease;
}

.language button:hover{
color:#111;
}

.language button.active{
background:#111;
color:#fff;
}
</style>

</head>

<script>

const verses = [{"text": "Господь — мій Пастир, я не матиму нестачі", "ref": "Псалом 23:1", "en": "The Lord is my shepherd; I shall not want.", "pl": "Pan jest moim pasterzem, niczego mi nie braknie.", "ref_en": "Psalm 23:1", "ref_pl": "Psalm 23:1"}, {"text": "Не бійся, бо Я з тобою, не тривожся, бо Я твій Бог. Я зміцню тебе і допоможу тобі, підтримаю тебе правицею Моєї праведності", "ref": "Ісаї 41:10", "en": "Do not fear, for I am with you; do not be anxious, for I am your God. I will strengthen you and help you; I will uphold you with my righteous right hand.", "pl": "Nie bój się, bo Ja jestem z tobą; nie lękaj się, bo Ja jestem twoim Bogiem. Umocnię cię i pomogę ci, podtrzymam cię prawicą mojej sprawiedliwości.", "ref_en": "Isaiah 41:10", "ref_pl": "Izajasza 41:10"}, {"text": "Надійся на Господа всім своїм серцем, а на власний розум не покладайся", "ref": "Приповістей 3:5", "en": "Trust in the Lord with all your heart, and do not lean on your own understanding.", "pl": "Zaufaj Panu z całego swego serca i nie polegaj na własnym rozumie.", "ref_en": "Proverbs 3:5", "ref_pl": "Przysłów 3:5"}, {"text": "Ми знаємо, що тим, хто любить Бога і покликаний за Його задумом, усе сприяє до добра", "ref": "Римлян 8:28", "en": "We know that all things work together for good for those who love God and are called according to His purpose.", "pl": "Wiemy, że Bóg współdziała we wszystkim ku dobremu z tymi, którzy Go miłują i są powołani według Jego zamysłu.", "ref_en": "Romans 8:28", "ref_pl": "Rzymian 8:28"}, {"text": "Я все можу в Тому, Хто мене зміцнює", "ref": "Филип’ян 4:13", "en": "I can do all things through Christ who strengthens me.", "pl": "Wszystko mogę w Tym, który mnie umacnia.", "ref_en": "Philippians 4:13", "ref_pl": "Filipian 4:13"}, {"text": "Мир залишаю вам, Мій мир Я даю вам. Я даю вам не так, як дає світ. Нехай не тривожиться ваше серце і не лякається", "ref": "Івана 14:27", "en": "Peace I leave with you; My peace I give you. I do not give to you as the world gives. Let not your heart be troubled or afraid.", "pl": "Pokój zostawiam wam, mój pokój daję wam. Nie tak, jak daje świat, Ja wam daję. Niech się nie trwoży wasze serce ani się nie lęka.", "ref_en": "John 14:27", "ref_pl": "Jana 14:27"}, {"text": "Ні про що не турбуйтеся, а в усьому молитвою та благанням з подякою відкривайте свої прохання Богові", "ref": "Филип’ян 4:6", "en": "Do not be anxious about anything, but in everything, by prayer and petition with thanksgiving, present your requests to God.", "pl": "O nic się nie martwcie, ale we wszystkim przez modlitwę i błaganie z dziękczynieniem przedstawiajcie wasze prośby Bogu.", "ref_en": "Philippians 4:6", "ref_pl": "Filipian 4:6"}, {"text": "Покладіть на Нього всі свої турботи, бо Він дбає про вас", "ref": "1 Петра 5:7", "en": "Cast all your cares on Him, because He cares for you.", "pl": "Powierzcie Mu wszystkie swoje troski, ponieważ On troszczy się o was.", "ref_en": "1 Peter 5:7", "ref_pl": "1 Piotra 5:7"}, {"text": "Бог для нас — притулок і сила, надійна допомога в бідах", "ref": "Псалом 46:2", "en": "God is our refuge and strength, a very present help in trouble.", "pl": "Bóg jest dla nas ucieczką i mocą, pomocą w utrapieniach najpewniejszą.", "ref_en": "Psalm 46:2", "ref_pl": "Psalm 46:2"}, {"text": "Бо Я знаю ті задуми, які маю щодо вас, — говорить Господь, — задуми на добро, а не на зло, щоб дати вам майбутнє і надію", "ref": "Єремії 29:11", "en": "For I know the plans I have for you, declares the Lord, plans for good and not for evil, to give you a future and a hope.", "pl": "Albowiem Ja znam zamiary, jakie mam wobec was — mówi Pan — zamiary pełne pokoju, a nie zguby, by zapewnić wam przyszłość i nadzieję.", "ref_en": "Jeremiah 29:11", "ref_pl": "Jeremiasza 29:11"}, {"text": "Поклади на Господа свої турботи, і Він тебе підтримає", "ref": "Псалом 55:23", "en": "Cast your cares on the Lord, and He will sustain you.", "pl": "Zrzuć swą troskę na Pana, a On cię podtrzyma.", "ref_en": "Psalm 55:23", "ref_pl": "Psalm 55:23"}, {"text": "Чи ж Я не наказав тобі: будь мужнім і сильним? Не бійся і не лякайся, бо з тобою Господь, твій Бог, куди б ти не пішов", "ref": "Ісуса Навина 1:9", "en": "Have I not commanded you? Be strong and courageous. Do not be afraid or discouraged, for the Lord your God is with you wherever you go.", "pl": "Czyż ci nie nakazałem: Bądź mężny i mocny? Nie bój się i nie lękaj, bo Pan, Bóg twój, jest z tobą wszędzie, dokądkolwiek pójdziesz.", "ref_en": "Joshua 1:9", "ref_pl": "Jozuego 1:9"}, {"text": "Господь — моє світло і моє спасіння: кого мені боятися?", "ref": "Псалом 27:1", "en": "The Lord is my light and my salvation; whom shall I fear?", "pl": "Pan jest moim światłem i zbawieniem: kogóż mam się lękać?", "ref_en": "Psalm 27:1", "ref_pl": "Psalm 27:1"}, {"text": "А ті, що надіються на Господа, відновлять сили, піднімуть крила, мов орли, побіжать — і не втомляться, підуть — і не знесиляться", "ref": "Ісаї 40:31", "en": "Those who hope in the Lord will renew their strength; they will rise on wings like eagles, run and not grow weary, walk and not faint.", "pl": "Lecz ci, którzy pokładają nadzieję w Panu, odzyskują siły, otrzymują skrzydła jak orły, biegną bez zmęczenia, bez znużenia idą.", "ref_en": "Isaiah 40:31", "ref_pl": "Izajasza 40:31"}, {"text": "Шукайте насамперед Царства Божого та Його праведності, а все це вам додасться", "ref": "Матвія 6:33", "en": "Seek first the kingdom of God and His righteousness, and all these things will be added to you.", "pl": "Starajcie się najpierw o królestwo Boże i o Jego sprawiedliwość, a wszystko to będzie wam dodane.", "ref_en": "Matthew 6:33", "ref_pl": "Mateusza 6:33"}, {"text": "Господь за мене — я не злякаюся. Що може зробити мені людина?", "ref": "Псалом 118:6", "en": "The Lord is for me; I will not be afraid. What can man do to me?", "pl": "Pan jest ze mną, nie będę się lękał. Cóż może mi uczynić człowiek?", "ref_en": "Psalm 118:6", "ref_pl": "Psalm 118:6"}, {"text": "Ім’я Господа — міцна вежа: праведник утікає до неї й перебуває в безпеці", "ref": "Приповістей 18:10", "en": "The name of the Lord is a strong tower; the righteous run to it and are safe.", "pl": "Imię Pana jest mocną wieżą; sprawiedliwy w niej się schroni i jest bezpieczny.", "ref_en": "Proverbs 18:10", "ref_pl": "Przysłów 18:10"}, {"text": "Довір Господу свій шлях і надійся на Нього — і Він подіє", "ref": "Псалом 37:5", "en": "Commit your way to the Lord; trust in Him, and He will act.", "pl": "Powierz Panu swoją drogę, zaufaj Mu, a On sam będzie działał.", "ref_en": "Psalm 37:5", "ref_pl": "Psalm 37:5"}, {"text": "Будьте мужніми та сильними, не бійтеся... бо Господь, твій Бог, Сам іде з тобою", "ref": "Повторення Закону 31:6", "en": "Be strong and courageous; do not be afraid, for the Lord your God Himself goes with you.", "pl": "Bądźcie mężni i silni, nie bójcie się... bo Pan, Bóg wasz, sam idzie z wami.", "ref_en": "Deuteronomy 31:6", "ref_pl": "Powtórzonego Prawa 31:6"}, {"text": "Підводжу свої очі до гір: звідки прийде мені допомога? Моя допомога від Господа, Який створив небо і землю", "ref": "Псалом 121:1-2", "en": "I lift up my eyes to the mountains: where does my help come from? My help comes from the Lord, the Maker of heaven and earth.", "pl": "Wznoszę swe oczy ku górom: skąd nadejdzie mi pomoc? Pomoc moja od Pana, który stworzył niebo i ziemię.", "ref_en": "Psalm 121:1-2", "ref_pl": "Psalm 121:1-2"}, {"text": "Любов довго терпить, любов милосердствує, не заздрить, любов не хваstatusться, не пишається", "ref": "1 Коринтян 13:4", "en": "Love is patient, love is kind. It does not envy, it does not boast, it is not proud.", "pl": "Miłość cierpliwa jest, łaskawa jest. Miłość nie zazdrości, nie przechwala się, nie unosi się pychą.", "ref_en": "1 Corinthians 13:4", "ref_pl": "1 Koryntian 13:4"}, {"text": "А тепер залишаються віра, надія, любов — оці три, але найбільша з них — любов", "ref": "1 Коринтян 13:13", "en": "And now these three remain: faith, hope and love. But the greatest of these is love.", "pl": "Tak więc trwają wiara, nadzieja i miłość — te trzy; z nich zaś największa jest miłość.", "ref_en": "1 Corinthians 13:13", "ref_pl": "1 Koryntian 13:13"}, {"text": "Хто не любить, той не пізнав Бога, тому що Бог є любов", "ref": "1 Івана 4:8", "en": "Whoever does not love does not know God, because God is love.", "pl": "Kto nie miłuje, nie zna Boga, bo Bóg jest miłością.", "ref_en": "1 John 4:8", "ref_pl": "1 Jana 4:8"}, {"text": "Ніхто не має більшої любові за ту, коли хтось життя своє віддає за своїх друзів", "ref": "Івана 15:13", "en": "Greater love has no one than this: that someone lays down his life for his friends.", "pl": "Nikt nie ma większej miłości od tej, gdy ktoś życie swoje oddaje za przyjaciół swoich.", "ref_en": "John 15:13", "ref_pl": "Jana 15:13"}, {"text": "Ми любимо Його, бо Він перший полюбив нас", "ref": "1 Івана 4:19", "en": "We love Him because He first loved us.", "pl": "My miłujemy, ponieważ On pierwszy nas umiłował.", "ref_en": "1 John 4:19", "ref_pl": "1 Jana 4:19"}, {"text": "Люби Господа Бога свого всім серцем своїм... Люби свого ближнього, як самого себе", "ref": "Матвія 22:37-39", "en": "Love the Lord your God with all your heart... Love your neighbor as yourself.", "pl": "Będziesz miłował Pana, Boga swego, całym swoim sercem... Będziesz miłował swego bliźniego jak siebie samego.", "ref_en": "Matthew 22:37-39", "ref_pl": "Mateusza 22:37-39"}, {"text": "Усе у вас хай робиться з любов’ю", "ref": "1 Коринтян 16:14", "en": "Let everything you do be done in love.", "pl": "Wszystko, co czynicie, niech się dokonuje w miłości.", "ref_en": "1 Corinthians 16:14", "ref_pl": "1 Koryntian 16:14"}, {"text": "А понад усе це одягніться в любов, яка є союзом досконалості", "ref": "Колосян 3:14", "en": "And above all these put on love, which binds everything together in perfect harmony.", "pl": "Na to wszystko zaś przyobleczcie miłość, która jest więzią doskonałości.", "ref_en": "Colossians 3:14", "ref_pl": "Kolosan 3:14"}, {"text": "Будьте ж один до одного лагідними, милосердними, прощаючи один одному, як і Бог у Христі простив вам", "ref": "Ефесян 4:32", "en": "Be kind and compassionate to one another, forgiving each other, just as in Christ God forgave you.", "pl": "Bądźcie dla siebie nawzajem dobrzy i miłosierni, przebaczając sobie nawzajem, tak jak i Bóg wam przebaczył w Chrystusie.", "ref_en": "Ephesians 4:32", "ref_pl": "Efezjan 4:32"}, {"text": "Насамперед майте щиру любов один до одного, бо любов покриває багато гріхів", "ref": "1 Петра 4:8", "en": "Above all, love each other deeply, because love covers over a multitude of sins.", "pl": "Przede wszystkim miejcie gorącą miłość jedni ku drugim, bo miłość zakrywa wiele grzechów.", "ref_en": "1 Peter 4:8", "ref_pl": "1 Piotra 4:8"}, {"text": "Дітоньки, любімо не словом чи язиком, а ділом та правдою", "ref": "1 Івана 3:18", "en": "Little children, let us not love with words or speech, but with action and in truth.", "pl": "Dzieci, nie miłujmy słowem ani językiem, lecz czynem i prawdą.", "ref_en": "1 John 3:18", "ref_pl": "1 Jana 3:18"}, {"text": "Любов нехай буде нелицемірною; ненавидьте зло, тримайтеся добра", "ref": "Римлян 12:9", "en": "Let love be genuine. Hate what is evil; hold fast to what is good.", "pl": "Miłość niech będzie bez obłudy. Brzydźcie się złem, trzymajcie się dobra.", "ref_en": "Romans 12:9", "ref_pl": "Rzymian 12:9"}, {"text": "Друг любить повсякчас, а в біді стає братом", "ref": "Приповістей 17:17", "en": "A friend loves at all times, and a brother is born for adversity.", "pl": "Przyjaciel kocha w każdym czasie, a brat staje się nim w nieszczęściu.", "ref_en": "Proverbs 17:17", "ref_pl": "Przysłów 17:17"}, {"text": "І як хочете, щоб вам чинили люди, так і ви чиніть їм", "ref": "Луки 6:31", "en": "Do to others as you would have them do to you.", "pl": "Jak chcecie, żeby ludzie wam czynili, tak wy im czyńcie.", "ref_en": "Луки 6:31", "ref_pl": "Луки 6:31"}, {"text": "Адже весь Закон виконується в одному вислові: Люби свого ближнього, як самого себе", "ref": "Галатів 5:14", "en": "For the whole law is fulfilled in one statement: Love your neighbor as yourself.", "pl": "Całe bowiem Prawo wypełnia się w tym jednym nakazie: Będziesz miłował swego bliźniego jak siebie samego.", "ref_en": "Galatians 5:14", "ref_pl": "Galatów 5:14"}, {"text": "Бо так Бог полюбив світ, що дав Свого Єдинородного Сина, щоб кожен, хто вірить у Нього, не загинув, але мав життя вічне", "ref": "Івана 3:16", "en": "For God so loved the world that He gave His one and only Son, that whoever believes in Him shall not perish but have eternal life.", "pl": "Tak bowiem Bóg umiłował świat, że dał swojego Jednorodzonego Syna, aby każdy, kto w Niego wierzy, nie zginął, ale miał życie wieczne.", "ref_en": "John 3:16", "ref_pl": "Jana 3:16"}, {"text": "Адже ви спасенні благодаттю через віру, і це не від вас, це дар Божий; не від діл, щоб ніхто не хвалився", "ref": "Ефесян 2:8-9", "en": "For you are saved by grace through faith, and this is not from yourselves; it is the gift of God, not by works, so that no one can boast.", "pl": "Łaską bowiem jesteście zbawieni przez wiarę. I to nie jest z was, lecz jest darem Boga; nie z uczynków, aby się nikt nie chlubił.", "ref_en": "Ephesians 2:8-9", "ref_pl": "Efezjan 2:8-9"}, {"text": "Бо якщо ти своїми устами визнаєш Ісуса Господом і повіриш у своєму серці, що Бог воскресив Його з мертвих, то спасешся", "ref": "Римлян 10:9", "en": "If you confess with your mouth that Jesus is Lord and believe in your heart that God raised Him from the dead, you will be saved.", "pl": "Jeśli ustami swoimi wyznasz, że Jezus jest Panem, i w sercu swoim uwierzysz, że Bóg wskrzesił Go z martwych, będziesz zbawiony.", "ref_en": "Romans 10:9", "ref_pl": "Rzymian 10:9"}, {"text": "Каже йому Ісус: Я є дорога, і правда, і життя. Ніхто не приходить до Отця, як тільки через Мене", "ref": "Івана 14:6", "en": "Jesus said: I am the way, and the truth, and the life. No one comes to the Father except through Me.", "pl": "Jezus mówi do niego: Ja jestem drogą, prawdą i życiem. Nikt nie przychodzi do Ojca inaczej jak tylko przeze Mnie.", "ref_en": "John 14:6", "ref_pl": "Jana 14:6"}, {"text": "Адже плата за гріх — смерть, а Божий дар — вічне життя в Христі Ісусі, нашому Господі", "ref": "Римлян 6:23", "en": "For the wages of sin is death, but the gift of God is eternal life in Christ Jesus our Lord.", "pl": "Albowiem zapłatą za grzech jest śmierć, a łaska Boża to życie wieczne w Chrystusie Jezusie, Panu naszym.", "ref_en": "Romans 6:23", "ref_pl": "Rzymian 6:23"}, {"text": "І ні в кому іншому немає спасіння, бо під небом немає іншого імені, даного людям, яким належало б нам спастися", "ref": "Дій 4:12", "en": "There is salvation in no one else, for there is no other name under heaven given to mankind by which we must be saved.", "pl": "I nie ma w żadnym innym zbawienia, gdyż nie dano ludziom pod niebem żadnego innego imienia, w którym moglibyśmy być zbawieni.", "ref_en": "Acts 4:12", "ref_pl": "Dziejów Apostolskich 4:12"}, {"text": "Ось Я стою під дверима і стукаю. Якщо хтось почує Мій голос і відчинить двері, Я ввійду до нього", "ref": "Об’явлення 3:20", "en": "Behold, I stand at the door and knock. If anyone hears My voice and opens the door, I will come in to him.", "pl": "Oto stoję u drzwi i kołaczę. Jeśli ktoś usłyszy mój głos i drzwi otworzy, wejdę do niego.", "ref_en": "Revelation 3:20", "ref_pl": "Objawienia 3:20"}, {"text": "Але Бог виявляє Свою любов до нас тим, що Христос помер за нас, коли ми були ще грішниками", "ref": "Римлян 5:8", "en": "But God demonstrates His love for us in this: while we were still sinners, Christ died for us.", "pl": "Bóg zaś okazuje nam swoją miłość przez to, że Chrystus umarł za nas, gdy byliśmy jeszcze grzesznikami.", "ref_en": "Romans 5:8", "ref_pl": "Rzymian 5:8"}, {"text": "Віра є підставою сподіваного, доказом речей невидимих", "ref": "Євреїв 11:1", "en": "Faith is the assurance of things hoped for, the conviction of things not seen.", "pl": "Wiara jest poręką tych dóbr, których się spodziewamy, dowodem tych rzeczywistości, których nie widzimy.", "ref_en": "Hebrews 11:1", "ref_pl": "Hebrajczyków 11:1"}, {"text": "Ісус же сказав йому: ... Усе можливе тому, хто вірить", "ref": "Марка 9:23", "en": "Jesus said to him: ... Everything is possible for the one who believes.", "pl": "Jezus powiedział mu: ... Wszystko jest możliwe dla tego, kto wierzy.", "ref_en": "Mark 9:23", "ref_pl": "Marka 9:23"}, {"text": "Сказав їй Ісус: Я є воскресіння і життя; хто вірить у Мене, хоч і помре, житиме", "ref": "Івана 11:25", "en": "Jesus said to her: I am the resurrection and the life; whoever believes in Me, though he dies, shall live.", "pl": "Jezus powiedział do niej: Ja jestem zmartwychwstaniem i życiem. Kto we Mnie wierzy, choćby umarł, żyć będzie.", "ref_en": "John 11:25", "ref_pl": "Jana 11:25"}, {"text": "І вже не живу я, а живе в мені Христос", "ref": "Галатів 2:20", "en": "I no longer live, but Christ lives in me.", "pl": "Teraz zaś już nie ja żyję, lecz żyje we mnie Chrystus.", "ref_en": "Galatians 2:20", "ref_pl": "Galatów 2:20"}, {"text": "Тому, коли хтось у Христі, той — нове створіння; старе минуло, ось сталося нове", "ref": "2 Коринтян 5:17", "en": "Therefore, if anyone is in Christ, he is a new creation; the old has gone, the new has come.", "pl": "Jeżeli więc ktoś pozostaje w Chrystusie, jest nowym stworzeniem. To, co dawne, minęło, a oto wszystko stało się nowe.", "ref_en": "2 Corinthians 5:17", "ref_pl": "2 Koryntian 5:17"}, {"text": "А тим, які прийняли Його, дав їм владу стати Божими дітьми — тим, які вірять у Його Ім’я", "ref": "Івана 1:12", "en": "To all who received Him, He gave the right to become children of God—to those who believe in His name.", "pl": "Wszystkim, którzy Go przyjęli, dał moc, aby się stali dziećmi Bożymi — tym, którzy wierzą w Jego imię.", "ref_en": "John 1:12", "ref_pl": "Jana 1:12"}, {"text": "Хто має Сина, той має життя; хто не має Сина Божого, той не має життя", "ref": "1 Івана 5:12", "en": "Whoever has the Son has life; whoever does not have the Son of God does not have life.", "pl": "Kto ma Syna, ma życie; kto nie ma Syna Bożego, nie ma życia.", "ref_en": "1 John 5:12", "ref_pl": "1 Jana 5:12"}, {"text": "Твоє Слово — світильник для моїх ніг і світло для моєї стежки", "ref": "Псалом 119:105", "en": "Your word is a lamp for my feet and a light on my path.", "pl": "Słowo Twoje jest lampą dla moich stóp i światłem na mojej ścieżce.", "ref_en": "Psalm 119:105", "ref_pl": "Psalm 119:105"}, {"text": "Якщо комусь із вас бракує мудрості, нехай просить у Бога, Який дає всім щедро і не дорікає, — і буде дана йому", "ref": "Якова 1:5", "en": "If any of you lacks wisdom, let him ask God, who gives generously to all without finding fault, and it will be given to him.", "pl": "Jeśli komuś z was brakuje mądrości, niech prosi Boga, który daje wszystkim hojnie i bez wypominania, a będzie mu dana.", "ref_en": "James 1:5", "ref_pl": "Jakuba 1:5"}, {"text": "Страх перед Господом — початок мудрості", "ref": "Приповістей 1:7", "en": "The fear of the Lord is the beginning of wisdom.", "pl": "Bojaźń Pana jest początkiem mądrości.", "ref_en": "Proverbs 1:7", "ref_pl": "Przysłów 1:7"}, {"text": "Усе Писання богонатхненне й корисне для навчання, для докору, для виправлення, для виховання в праведності", "ref": "2 Тимофія 3:16", "en": "All Scripture is God-breathed and useful for teaching, rebuking, correcting and training in righteousness.", "pl": "Wszelkie Pismo jest natchnione przez Boga i pożyteczne do nauczania, do wykrywania błędów, do poprawiania i wychowywania w sprawiedliwości.", "ref_en": "2 Timothy 3:16", "ref_pl": "2 Tymoteusza 3:16"}, {"text": "Тож підкоріться Богові, протистаньте дияволу — і він утече від вас", "ref": "Якова 4:7", "en": "Submit yourselves, then, to God. Resist the devil, and he will flee from you.", "pl": "Poddajcie się więc Bogu, przeciwstawcie się diabłu, a ucieknie od was.", "ref_en": "James 4:7", "ref_pl": "Jakuba 4:7"}, {"text": "Просіть — і дасться вам; шукайте — і знайдете; стукайте — і відчинять вам", "ref": "Mатвія 7:7", "en": "Ask and it will be given to you; seek and you will find; knock and the door will be opened to you.", "pl": "Proście, a będzie wam dane; szukajcie, a znajdziecie; kołaczcie, a otworzą wam.", "ref_en": "Mатвія 7:7", "ref_pl": "Mатвія 7:7"}, {"text": "Понад усе, що зберігається, бережи своє серце, бо з нього б’ють джерела життя", "ref": "Приповістей 4:23", "en": "Above all else, guard your heart, for everything you do flows from it.", "pl": "Z całą pilnością strzeż swego serca, bo z niego tryska źródło życia.", "ref_en": "Proverbs 4:23", "ref_pl": "Przysłów 4:23"}, {"text": "Блаженний чоловік, який не ходить на раду нечестивих... але в Законі Господньому його воля", "ref": "Псалом 1:1-2", "en": "Blessed is the one who does not walk in the counsel of the wicked... but whose delight is in the law of the Lord.", "pl": "Szczęśliwy człowiek, który nie idzie za radą występnych... lecz ma upodobanie w Prawie Pana.", "ref_en": "Psalm 1:1-2", "ref_pl": "Psalm 1:1-2"}, {"text": "Чого Господь вимагає від тебе? Тільки чинити справедливість, любити милосердя і смиренно ходити перед твоїм Богом", "ref": "Михея 6:8", "en": "What does the Lord require of you? Only to act justly, love mercy, and walk humbly with your God.", "pl": "Powiedziano ci, człowiecze, co jest dobre i czego Pan żąda od ciebie: tylko wypełniać prawo, kochać wierność i pokornie chodzić z Bogiem swoim.", "ref_en": "Micah 6:8", "ref_pl": "Micheasza 6:8"}, {"text": "І не пристосовуйтеся до цього віку, але змінюйтеся оновленням вашого розуму", "ref": "Римлян 12:2", "en": "Do not conform to this age, but be transformed by the renewing of your mind.", "pl": "Nie dostosowujcie się do tego świata, lecz przemieniajcie się przez odnawianie umysłu.", "ref_en": "Romans 12:2", "ref_pl": "Rzymian 12:2"}, {"text": "Будьте ж виконавцями слова, а не тільки слухачами, які самі себе обманюють", "ref": "Якова 1:22", "en": "Be doers of the word, and not hearers only, deceiving yourselves.", "pl": "Stawajcie się wykonawcami słowa, a nie tylko słuchaczami, oszukującymi samych siebie.", "ref_en": "James 1:22", "ref_pl": "Jakuba 1:22"}, {"text": "Лагідна відповідь відвертає гнів, а образливе слово викликає лють", "ref": "Приповістей 15:1", "en": "A gentle answer turns away wrath, but a harsh word stirs up anger.", "pl": "Łagodna odpowiedź uśmierza gniew, lecz przykre słowo wywołuje złość.", "ref_en": "Proverbs 15:1", "ref_pl": "Przysłów 15:1"}, {"text": "Шукайте Господа, доки Його можна знайти, кличте Його, доки Він близько", "ref": "Ісаї 55:6", "en": "Seek the Lord while He may be found; call on Him while He is near.", "pl": "Szukajcie Pana, gdy się pozwala znaleźć, wzywajcie Go, dopóki jest blisko.", "ref_en": "Isaiah 55:6", "ref_pl": "Izajasza 55:6"}, {"text": "Не обманюйтеся: Бог зневажений не буває. Що людина посіє, те й пожне", "ref": "Галатів 6:7", "en": "Do not be deceived: God is not mocked. Whatever a person sows, that he will also reap.", "pl": "Nie łudźcie się: Bóg nie pozwala z siebie szydzić. Co człowiek sieje, to i żąć będzie.", "ref_en": "Galatians 6:7", "ref_pl": "Galatów 6:7"}, {"text": "Хай так світить ваше світло перед людьми, щоб вони бачили ваші добрі діла і прославляли вашого Отця, Який на небесах", "ref": "Матвія 5:16", "en": "Let your light shine before others, that they may see your good works and glorify your Father in heaven.", "pl": "Tak niech świeci wasze światło przed ludźmi, aby widzieli wasze dobre uczynki i chwalili Ojca waszego, który jest w niebie.", "ref_en": "Matthew 5:16", "ref_pl": "Mateusza 5:16"}, {"text": "Якщо визнаємо свої гріхи, то Він є вірний і праведний, щоб простити нам гріхи й очистити нас від усякої неправди", "ref": "1 Івана 1:9", "en": "If we confess our sins, He is faithful and just to forgive us our sins and cleanse us from all unrighteousness.", "pl": "Jeśli wyznajemy nasze grzechy, On jest wierny i sprawiedliwy i przebaczy nam grzechy, i oczyści nas z wszelkiej nieprawości.", "ref_en": "1 John 1:9", "ref_pl": "1 Jana 1:9"}, {"text": "Прийдіть і розсудимо, — говорить Господь. — Якщо ваші гріхи будуть як багряниця, вибілю як сніг", "ref": "Ісаї 1:18", "en": "Come now, let us reason together, says the Lord. Though your sins are like scarlet, I will make them white as snow.", "pl": "Chodźcie więc, rozsądźmy — mówi Pan. Choćby wasze grzechy były jak szkarłat, jak śnieg wybieleją.", "ref_en": "Isaiah 1:18", "ref_pl": "Izajasza 1:18"}, {"text": "Як далеко схід від заходу, так віддалив Він від нас наші беззаконня", "ref": "Псалом 103:12", "en": "As far as the east is from the west, so far has He removed our transgressions from us.", "pl": "Jak daleko jest wschód od zachodu, tak daleko odsuwa od nas nasze występki.", "ref_en": "Psalm 103:12", "ref_pl": "Psalm 103:12"}, {"text": "Це милість Господня, що ми не вигублені, бо не вичерпалося Його співчуття. Воно оновлюється щоранку; велика Твоя вірність", "ref": "Плач Єремії 3:22-23", "en": "Because of the Lord's mercy we are not consumed, for His compassion never fails. They are new every morning; great is Your faithfulness.", "pl": "Nie wyczerpała się litość Pana, nie ustaje Jego miłosierdzie. Odnawia się ono co rano; wielka jest Twoja wierność.", "ref_en": "Lamentations 3:22-23", "ref_pl": "Lamentacje 3:22-23"}, {"text": "Серце чисте створи в мені, Боже, і духа правого віднови в нутрі моєму", "ref": "Псалом 51:12", "en": "Create in me a clean heart, O God, and renew a right spirit within me.", "pl": "Stwórz, o Boże, we mnie serce czyste i odnów we mnie ducha prawego.", "ref_en": "Psalm 51:12", "ref_pl": "Psalm 51:12"}, {"text": "У Ньому маємо викуплення Його кров’ю, прощення провин, через багатство Його благодаті", "ref": "Ефесян 1:7", "en": "In Him we have redemption through His blood, the forgiveness of sins, according to the riches of His grace.", "pl": "W Nim mamy odkupienie przez Jego krew — odpuszczenie występków, według bogactwa Jego łaski.", "ref_en": "Ephesians 1:7", "ref_pl": "Efezjan 1:7"}, {"text": "Терпіть один одного і прощайте взаємно, якщо хтось проти когось має образу; як Господь простив вам, так само й ви робіть", "ref": "Колосян 3:13", "en": "Bear with one another and forgive each other if anyone has a grievance against someone; as the Lord forgave you, so also do you.", "pl": "Znoście jedni drugich i wybaczajcie sobie nawzajem, jeśliby ktoś miał zarzut przeciw drugiemu; jak Pan wybaczył wam, tak i wy.", "ref_en": "Colossians 3:13", "ref_pl": "Kolosan 3:13"}, {"text": "Отже, тепер немає жодного осуду тим, які в Христі Ісусі", "ref": "Римлян 8:1", "en": "Therefore, there is now no condemnation for those who are in Christ Jesus.", "pl": "Teraz więc nie ma już potępienia dla tych, którzy są w Chrystusie Jezusie.", "ref_en": "Romans 8:1", "ref_pl": "Rzymian 8:1"}, {"text": "Бо Ти, Господи, добрий і прощаєш, і многомилостивий до всіх, хто кличе Тебе", "ref": "Псалом 86:5", "en": "For You, Lord, are good and forgiving, rich in mercy to all who call upon You.", "pl": "Ty bowiem, Panie, jesteś dobry i łaskawy, bogaty w miłosierdzie dla wszystkich, którzy Cię wzywają.", "ref_en": "Psalm 86:5", "ref_pl": "Psalm 86:5"}, {"text": "Я, Я Сам стираю твої провини заради Себе і не згадаю твоїх гріхів", "ref": "Ісаї 43:25", "en": "I, I am He who blots out your transgressions for My own sake, and I will not remember your sins.", "pl": "Ja, właśnie Ja, przekreślam twe przestępstwa i nie wspominam twoich grzechów.", "ref_en": "Isaiah 43:25", "ref_pl": "Izajasza 43:25"}, {"text": "Та Він сказав мені: Досить тобі Моєї благодаті, бо сила Моя виявляється в немочі", "ref": "2 Коринтян 12:9", "en": "But He said to me: My grace is sufficient for you, for My power is made perfect in weakness.", "pl": "Lecz powiedział mi: Wystarczy ci mojej łaski. Moc bowiem w słabości się doskonali.", "ref_en": "2 Corinthians 12:9", "ref_pl": "2 Koryntian 12:9"}, {"text": "Одягніться в повну Божу зброю, щоб ви могли протистояти підступам диявола", "ref": "Ефесян 6:11", "en": "Put on the full armor of God, so that you can stand against the schemes of the devil.", "pl": "Przyobleczcie pełną zbroję Bożą, abyście mogli przeciwstawić się podstępnym zakusom diabła.", "ref_en": "Ephesians 6:11", "ref_pl": "Efezjan 6:11"}, {"text": "Вас спіткала тільки людська спокуса. Але вірний Бог, Який не попустить, щоб ви були спокушувані більше, ніж можете перенести", "ref": "1 Коринтян 10:13", "en": "You are tempted only in the human way. But God is faithful and will not let you be tempted beyond what you can bear.", "pl": "Nie spotkała was pokusa ponad ludzką miarę. Bóg jest wierny i nie pozwoli was kusić ponad to, co potraficie znieść.", "ref_en": "1 Corinthians 10:13", "ref_pl": "1 Koryntian 10:13"}, {"text": "Блаженний чоловік, який витримає спокусу, бо, ставши випробуваним, він одержить вінець життя", "ref": "Якова 1:12", "en": "Blessed is the one who endures temptation, for when he has been tested, he will receive the crown of life.", "pl": "Szczęśliwy człowiek, który wytrwa w próbie, bo gdy zostanie wypróbowany, otrzyma wieniec życia.", "ref_en": "James 1:12", "ref_pl": "Jakuba 1:12"}, {"text": "Коли я йду навіть долиною тіні смерті, я не злякаюся зла, бо Ти зі мною", "ref": "Псалом 23:4", "en": "Even though I walk through the valley of the shadow of death, I will fear no evil, for You are with me.", "pl": "Choćbym przechodził przez ciemną dolinę śmierci, zła się nie ulęknę, bo Ty jesteś ze mną.", "ref_en": "Psalm 23:4", "ref_pl": "Psalm 23:4"}, {"text": "Що ж скажемо на це? Якщо Бог за нас, то хто проти нас?", "ref": "Римлян 8:31", "en": "What then shall we say to these things? If God is for us, who can be against us?", "pl": "Cóż więc na to powiemy? Jeżeli Bóg z nami, któż przeciwko nam?", "ref_en": "Romans 8:31", "ref_pl": "Rzymian 8:31"}, {"text": "Ви від Бога, дітоньки, і ви перемогли їх, бо Той, Хто у вас, більший за того, хто у світі", "ref": "1 Івана 4:4", "en": "You are from God, little children, and yo const refBookMap={
"Псалом":"psalms","Ісаї":"isaiah","Приповістей":"proverbs","Римлян":"romans",
"Филип’ян":"philippians","Івана":"john","1 Петра":"1-peter","Єремії":"jeremiah",

"1 Солунян":"1-thessalonians"
};

async function getKJV(ref){
if(kjvCache[ref]) return kjvCache[ref];

let bookName=null;
let bookSlug=null;

for(const name of Object.keys(refBookMap).sort((a,b)=>b.length-a.length)){
if(ref.startsWith(name+" ")){
bookName=name;
bookSlug=refBookMap[name];
break;
}
}

if(!bookSlug) throw new Error("Unknown Bible book: "+ref);

const passage=ref.slice(bookName.length+1);
const match=passage.match(/^(\d+):(\d+)(?:-(\d+))?$/);
if(!match) throw new Error("Unsupported reference: "+ref);

const chapter=match[1];
const from=parseInt(match[2],10);
const to=match[3] ? parseInt(match[3],10) : from;

const url=`https://cdn.jsdelivr.net/gh/jsubroto/bible-api/versions/kjv/books/${bookSlug}/chapters/${chapter}.json`;
const response=await fetch(url);
if(!response.ok) throw new Error("KJV request failed");

const data=await response.json();
const verses=data.verses || [];
const selected=verses.filter(v=>v.verse>=from && v.verse<=to).map(v=>v.text);

if(!selected.length) throw new Error("KJV passage not found");

const text=selected.join(" ");
kjvCache[ref]=text;
localStorage.setItem("kjvCache",JSON.stringify(kjvCache));
return text;
}

async function renderVerse(){

if(lastIndex<0) return;

const random=verses[lastIndex];

const verse=document.getElementById("verse");
const ref=document.getElementById("ref");
const logo=document.querySelector(".logo");

verse.style.opacity=0;
ref.style.opacity=0;

setTimeout(async ()=>{
let text=random.text;
let reference=random.ref;

if(currentLanguage==="en"){
logo.innerText="A WORD FOR YOU";
try{
text=await getKJV(random.ref);
reference=random.ref_en;
}catch(error){
text="Unable to load the King James Version. Please try again.";
reference=random.ref_en;
}
}else if(currentLanguage==="pl"){
logo.innerText="SŁOWO DLA CIEBIE";
text=random.pl;
reference=random.ref_pl;
}else{
logo.innerText="СЛОВО ДЛЯ ТЕБЕ";
}

verse.innerText=text;
ref.innerText=reference;

verse.style.opacity=1;
ref.style.opacity=1;

},180);
}

function newVerse(){

let randomIndex;

do{
randomIndex=Math.floor(Math.random()*verses.length);
}
while(randomIndex===lastIndex && verses.length>1);

lastIndex=randomIndex;
renderVerse();
}

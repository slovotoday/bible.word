<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#fafafa;
padding:24px;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
color:#111;

cursor:pointer;
}

.card{
max-width:420px;
width:100%;
text-align:center;
}

.logo{
font-size:11px;
letter-spacing:6px;
text-transform:uppercase;
color:#b8b8b8;

margin-bottom:48px;
}

.verse{
font-size:42px;
font-weight:200;
line-height:1.18;
letter-spacing:-1px;

margin-bottom:34px;

transition:.35s;
}

.ref{
font-size:11px;
letter-spacing:2px;
text-transform:uppercase;
color:#9c9c9c;

transition:.35s;
}

/* LayerUp Studio */

.layerup{
display:inline-flex;
align-items:center;
gap:10px;

margin-top:48px;

padding:11px 18px;

border:1px solid #ececec;
border-radius:999px;

background:white;

font-size:12px;
letter-spacing:.8px;
text-decoration:none;

color:#8d8d8d;

transition:.25s;
}

.layerup:hover{
color:#111;
border-color:#d7d7d7;
background:#fff;
transform:translateY(-1px);
}

.layerup svg{
width:15px;
height:15px;
fill:currentColor;
}

.layerup .arrow{
font-size:14px;
line-height:1;
transition:.25s;
}

.layerup:hover .arrow{
transform:translate(2px,-2px);
}


/* Language selector */
.language{
position:fixed;
top:20px;
right:20px;
z-index:10;
display:flex;
align-items:center;
gap:2px;
padding:3px;
border:1px solid #e9e9e9;
border-radius:999px;
background:rgba(255,255,255,.92);
box-shadow:0 2px 12px rgba(0,0,0,.04);
}

.language button{
border:0;
background:transparent;
color:#999;
font-family:inherit;
font-size:10px;
letter-spacing:1px;
padding:6px 9px;
border-radius:999px;
cursor:pointer;
transition:.2s ease;
}

.language button:hover{
color:#111;
}

.language button.active{
background:#111;
color:#fff;
}
</style>

</head>

<body onclick="newVerse()">
<div class="language" onclick="event.stopPropagation();">
<button type="button" data-lang="uk">UA</button>
<button type="button" data-lang="pl">PL</button>
<button type="button" data-lang="en">EN</button>
</div>

<div class="card">

<div class="logo">
слово для тебе
</div>

<div id="ref" class="ref"></div>

<a
class="layerup"
href="https://layerupstudio.pl/uk"
target="_blank"
rel="noopener noreferrer"
onclick="event.stopPropagation();">

<span>LayerUp Studio</span>
<span class="arrow">↗</span>

pl": "Izajasza", "chapters": 66}, {"osis": "jer", "en": "Jeremiah", "uk": "Єремії", "pl": "Jeremiasza", "chapters": 52}, {"osis": "lam", "en": "Lamentations", "uk": "Плач Єремії", "pl": "Lamentacji", "chapters": 5}, {"osis": "ezek", "en": "Ezekiel", "uk": "Єзекіїля", "pl": "Ezechiela", "chapters": 48}, {"osis": "dan", "en": "Daniel", "uk": "Даниїла", "pl": "Daniela", "chapters": 12}, {"osis": "hos", "en": "Hosea", "uk": "Осії", "pl": "Ozeasza", "chapters": 14}, {"osis": "joel", "en": "Joel", "uk": "Йоіла", "pl": "Joela", "chapters": 3}, {"osis": "amos", "en": "Amos", "uk": "Амоса", "pl": "Amosa", "chapters": 9}, {"osis": "obad", "en": "Obadiah", "uk": "Овдія", "pl": "Abdiasza", "chapters": 1}, {"osis": "jonah", "en": "Jonah", "uk": "Йони", "pl": "Jonasza", "chapters": 4}, {"osis": "mic", "en": "Micah", "uk": "Михея", "pl": "Micheasza", "chapters": 7}, {"osis": "nah", "en": "Nahum", "uk": "Наума", "pl": "Nahuma", "chapters": 3}, {"osis": "hab", "en": "Habakkuk", "uk": "Авакума", "pl": "Habakuka", "chapters": 3}, {"osis": "zeph", "en": "Zephaniah", "uk": "Софонії", "pl": "Sofoniasza", "chapters": 3}, {"osis": "hag", "en": "Haggai", "uk": "Огія", "pl": "Aggeusza", "chapters": 2}, {"osis": "zech", "en": "Zechariah", "uk": "Захарії", "pl": "Zachariasza", "chapters": 14}, {"osis": "mal", "en": "Malachi", "uk": "Малахії", "pl": "Malachiasza", "chapters": 4}, {"osis": "matt", "en": "Matthew", "uk": "Матвія", "pl": "Mateusza", "chapters": 28}, {"osis": "mark", "en": "Mark", "uk": "Марка", "pl": "Marka", "chapters": 16}, {"osis": "luke", "en": "Luke", "uk": "Луки", "pl": "Łukasza", "chapters": 24}, {"osis": "john", "en": "John", "uk": "Івана", "pl": "Jana", "chapters": 21}, {"osis": "acts", "en": "Acts", "uk": "Дій", "pl": "Dziejów Apostolskich", "chapters": 28}, {"osis": "rom", "en": "Romans", "uk": "Римлян", "pl": "Rzymian", "chapters": 16}, {"osis": "1cor", "en": "1 Corinthians", "uk": "1 Коринтян", "pl": "1 Koryntian", "chapters": 16}, {"osis": "2cor", "en": "2 Corinthians", "uk": "2 Коринтян", "pl": "2 Koryntian", "chapters": 13}, {"osis": "gal", "en": "Galatians", "uk": "Галатів", "pl": "Galatów", "chapters": 6}, {"osis": "eph", "en": "Ephesians", "uk": "Ефесян", "pl": "Efezjan", "chapters": 6}, {"osis": "phil", "en": "Philippians", "uk": "Филип’ян", "pl": "Filipian", "chapters": 4}, {"osis": "col", "en": "Colossians", "uk": "Колосян", "pl": "Kolosan", "chapters": 4}, {"osis": "1thess", "en": "1 Thessalonians", "uk": "1 Солунян", "pl": "1 Tesaloniczan", "chapters": 5}, {"osis": "2thess", "en": "2 Thessalonians", "uk": "2 Солунян", "pl": "2 Tesaloniczan", "chapters": 3}, {"osis": "1tim", "en": "1 Timothy", "uk": "1 Тимофія", "pl": "1 Tymoteusza", "chapters": 6}, {"osis": "2tim", "en": "2 Timothy", "uk": "2 Тимофія", "pl": "2 Tymoteusza", "chapters": 4}, {"osis": "titus", "en": "Titus", "uk": "Тита", "pl": "Tytusa", "chapters": 3}, {"osis": "phlm", "en": "Philemon", "uk": "Филимона", "pl": "Filemona", "chapters": 1}, {"osis": "heb", "en": "Hebrews", "uk": "Євреїв", "pl": "Hebrajczyków", "chapters": 13}, {"osis": "jas", "en": "James", "uk": "Якова", "pl": "Jakuba", "chapters": 5}, {"osis": "1pet", "en": "1 Peter", "uk": "1 Петра", "pl": "1 Piotra", "chapters": 5}, {"osis": "2pet", "en": "2 Peter", "uk": "2 Петра", "pl": "2 Piotra", "chapters": 3}, {"osis": "1john", "en": "1 John", "uk": "1 Івана", "pl": "1 Jana", "chapters": 5}, {"osis": "2john", "en": "2 John", "uk": "2 Івана", "pl": "2 Jana", "chapters": 1}, {"osis": "3john", "en": "3 John", "uk": "3 Івана", "pl": "3 Jana", "chapters": 1}, {"osis": "jude", "en": "Jude", "uk": "Юди", "pl": "Judy", "chapters": 1}, {"osis": "rev", "en": "Revelation", "uk": "Об’явлення", "pl": "Objawienia", "chapters": 22}];
let currentLanguage=localStorage.getItem("language") || "uk";

const languageButtons=document.querySelectorAll("[data-lang]");

async function fetchJson(url){
const response=await fetch(url);
if(!response.ok) throw new Error("Request failed: "+response.status);
return response.json();
}

const cache={};
let lastVerse=null;

async function getRandomVerse(){
const book=bibleBooks[Math.floor(Math.random()*bibleBooks.length)];
const chapter=Math.floor(Math.random()*book.chapters)+1;

const data=await fetchJson(`https://api.midvash.com/v1/kjv/${book.osis}/${chapter}`);
const payload=data.data || data;
const verses=payload.verses || [];

if(!verses.length) throw new Error("No verses found");

const chosen=verses[Math.floor(Math.random()*verses.length)];
return {
book,
chapter,
verse:Number(chosen.number ?? chosen.verse),
};
}

async function getVerseFromMidvash(version, osis, chapter, verse){
const key=`${version}|${osis}|${chapter}|${verse}`;
if(cache[key]) return cache[key];

const data=await fetchJson(`https://api.midvash.com/v1/${version}/${osis}/${chapter}/${verse}`);
const result=data.data || data;
const text=result.text || result.verse?.text;

if(!text) throw new Error("Verse not found");

cache[key]=text;
return text;
}

// Український текст — сучасний переклад Рафаїла Турконяка (УТТ 2011)
async function getVerseFromTurkoniak(book, chapter, verse){
const key=`utt|${book.en}|${chapter}|${verse}`;
if(cache[key]) return cache[key];

const data=await fetchJson(`https://bolls.life/get-verse/UTT/${encodeURIComponent(book.en)}/${chapter}/${verse}/`);
const text=data.text || data.verse?.text;

if(!text) throw new Error("Turkoniak verse not found");

// Bolls може повертати HTML-розмітку — для нашої картки залишаємо чистий текст.
const cleanText=text.replace(/<[^>]*>/g, "").replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").trim();
cache[key]=cleanText;
return cleanText;
}

async function getNBG(osis, chapter, verse){
const refBook=bibleBooks.find(b=>b.osis===osis);
if(!refBook) throw new Error("Book not found");

const cacheKey=`nbg|${osis}|${chapter}|${verse}`;
if(cache[cacheKey]) return cache[cacheKey];

const ref=`${refBook.en} ${chapter}:${verse}`;
const url="https://api.biblesupersearch.com/api?"+new URLSearchParams({
bible:"pol_nbg",
reference:ref,
data_format:"minimal",
markup:"none"
});

const data=await fetchJson(url);

if(data.errors && data.errors.length) throw new Error(data.errors.join(", "));

const results=data.results?.pol_nbg;
if(!results?.length) throw new Error("NBG verse not found");

const text=results[0].text;
cache[cacheKey]=text;
return text;
}

function getReference(book,chapter,verse,language){
const name=language==="en" ? book.en : language==="pl" ? book.pl : book.uk;
return `${name} ${chapter}:${verse}`;
}

function setLanguage(language){
currentLanguage=language;
localStorage.setItem("language",currentLanguage);

languageButtons.forEach(button=>{
button.classList.toggle("active",button.dataset.lang===currentLanguage);
});

renderVerse();
}

languageButtons.forEach(button=>{
button.addEventListener("click",()=>{
setLanguage(button.dataset.lang);
});
});

languageButtons.forEach(button=>{
button.classList.toggle("active",button.dataset.lang===currentLanguage);
});

async function renderVerse(){

if(!lastVerse) return;

const verse=document.getElementById("verse");
const ref=document.getElementById("ref");
const logo=document.querySelector(".logo");

verse.style.opacity=0;
ref.style.opacity=0;

try{
let text;

if(currentLanguage==="en"){
logo.innerText="A WORD FOR YOU";
text=await getVerseFromMidvash("kjv",lastVerse.book.osis,lastVerse.chapter,lastVerse.verse);
}else if(currentLanguage==="pl"){
logo.innerText="SŁOWO DLA CIEBIE";
text=await getNBG(lastVerse.book.osis,lastVerse.chapter,lastVerse.verse);
}else{
logo.innerText="СЛОВО ДЛЯ ТЕБЕ";
text=await getVerseFromTurkoniak(lastVerse.book,lastVerse.chapter,lastVerse.verse);
}

verse.innerText=text;
ref.innerText=getReference(lastVerse.book,lastVerse.chapter,lastVerse.verse,currentLanguage);

verse.style.opacity=1;
ref.style.opacity=1;
}catch(error){
verse.innerText=currentLanguage==="pl"
?"Nie udało się załadować tekstu. Spróbuj ponownie."
:currentLanguage==="en"
?"Unable to load the verse. Please try again."
:"Не вдалося завантажити вірш. Спробуйте ще раз.";
ref.innerText=getReference(lastVerse.book,lastVerse.chapter,lastVerse.verse,currentLanguage);
verse.style.opacity=1;
ref.style.opacity=1;
}
}

async function newVerse(){
try{
lastVerse=await getRandomVerse();
renderVerse();
}catch(error){
document.getElementById("verse").innerText="Не вдалося завантажити вірш. Спробуйте ще раз.";
console.error(error);
}
}

newVerse();
</script>
